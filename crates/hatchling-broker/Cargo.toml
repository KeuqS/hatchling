[package]
name = "hatchling-broker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "The broker daemon agents connect to: socket lifecycle, peer authorization, handshake"

[lints]
workspace = true

[dependencies]
# The artifact pipeline core: pinned build requests,
# broker-asserted provenance, the share-review gate, and the one
# delivery function the broker's artifact ops go through.
hatchling-artifact = { version = "0.1.0", path = "../hatchling-artifact" }
hatchling-core = { version = "0.1.0", path = "../hatchling-core" }
# Spaces: broker-asserted membership, the admission factors,
# and space tasks. The broker owns the space store and the session
# admission table; the cell never touches either.
hatchling-space = { version = "0.1.0", path = "../hatchling-space" }
# The device endpoint's own key: the broker signs each device's
# nonce, so a device knows it reached the broker it paired with.
ed25519-dalek = "2"
# The broker owns the only path to the credential store: every vault op
# is mediated through the peer-authorized session, never direct.
hatchling-vault = { version = "0.1.0", path = "../hatchling-vault" }
# Security keys over USB: the CLI and start-up reach a FIDO2 key
# through this transport; the vault still decides.
hatchling-fido2 = { version = "0.1.0", path = "../hatchling-fido2" }
# The broker owns the only path to durable memory: every memory op is
# mediated through the peer-authorized session, never direct.
hatchling-memory = { version = "0.1.0", path = "../hatchling-memory" }
# The broker owns the only path to goals and tracking: writes go
# through its grant-checked goals ops, and the feed's queries through a
# read-only reader, never direct.
hatchling-goals = { version = "0.1.0", path = "../hatchling-goals" }
# The broker owns scheduled work: the sealed schedule store,
# the schedule session ops, and the dispatcher's real store and delivery
# path. The cell never sees any of it.
hatchling-scheduler = { version = "0.1.0", path = "../hatchling-scheduler" }
# The broker owns the only path to the network: every egress request is
# mediated through the peer-authorized session with surrogate validation
# and allowlist checking.
hatchling-egress = { version = "0.1.0", path = "../hatchling-egress" }
# The broker owns the channel endpoints: the cell never touches a channel
# socket directly; it reaches channels only through the peer-authorized
# session.
hatchling-channel = { version = "0.1.0", path = "../hatchling-channel" }
# The broker owns cell policy; the isolation seam builds and
# supervises the cells it decides on. The broker's cell code speaks only
# to the seam's platform-neutral trait.
hatchling-isolation = { version = "0.1.0", path = "../hatchling-isolation" }
# The broker's own process: its uid for the local API's owner, socket
# umasks, and test fixtures. No cell mechanism goes through it any more.
hatchling-sys = { version = "0.1.0", path = "../hatchling-sys" }
# The broker owns skill admission: signature verification, code identity
# pinning, and call-time capability enforcement. The cell never self-attests.
hatchling-skill = { version = "0.1.0", path = "../hatchling-skill" }
# Memory hygiene for credential bytes in the egress credential fetcher.
zeroize = "1"
# Constant-time comparison of a harness relay's surrogate key.
subtle = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
# The skill-cell helper receives its cell config as JSON.
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
# The feed: a feed schedule's digest is generated here, from
# the read-only query path.
hatchling-feed = { version = "0.1.0", path = "../hatchling-feed" }

# The adversarial suite runs its own sequential runner (see the module
# docs in tests/adversarial.rs): the probe reports through the test
# process's stdout, which libtest's own output must never share.
[[test]]
name = "adversarial"
path = "tests/adversarial.rs"
harness = false

[dev-dependencies]
# Component tests use the real kernel identity oracle; the adversarial
# suite also uses its pipe/stdio wrappers to capture probe output.
rustix = { version = "0.38", features = ["fs", "process", "pipe", "stdio"] }
# Operator CLI tests verify sealed envelopes through the vault API; the
# keyring tests unlock with the vault's software FIDO2 key.
hatchling-vault = { version = "0.1.0", path = "../hatchling-vault", features = ["virtual-authenticator"] }
# Memory component tests exercise the broker's memory ops through the store API.
hatchling-memory = { version = "0.1.0", path = "../hatchling-memory" }
# Cell boundary tests spawn the real agent binary (built by
# `cargo build --workspace` in scripts/check.sh); the path dependency
# keeps broker and agent versions in lockstep.
hatchling-agent = { version = "0.1.0", path = "../hatchling-agent" }
# The adversarial suite spawns the real probe binary and interprets
# its reports; the path dependency keeps driver and probe in lockstep.
hatchling-adversarial = { version = "0.1.0", path = "../hatchling-adversarial" }
# Skill invocation tests build signed manifests via the real ed25519 path.
ed25519-dalek = "2"
# The envelope proof drives a real agent loop through the real
# provider, and checks its request against the real envelope.
hatchling-loop = { version = "0.1.0", path = "../hatchling-loop" }
hatchling-model = { version = "0.1.0", path = "../hatchling-model" }
hatchling-prompt = { version = "0.1.0", path = "../hatchling-prompt" }
# The delivery test builds a research run's report through the
# artifact pipeline.
hatchling-research = { version = "0.1.0", path = "../hatchling-research" }
