[package]
name = "hatchling-scheduler"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "Scheduled work: cron timing in explicit IANA timezones, subset-closed schedule grants, and the dispatcher that fires, delivers, and parks."

[lints]
workspace = true

[dependencies]
hatchling-core = { version = "0.1.0", path = "../hatchling-core" }
# Timestamps, civil time, and the system IANA timezone database
# (/usr/share/zoneinfo): cron is evaluated in each schedule's own zone,
# across daylight-saving gaps and folds. No bundled database, no
# platform extras.
jiff = { version = "0.2.24", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
