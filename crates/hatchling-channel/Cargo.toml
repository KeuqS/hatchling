[package]
name = "hatchling-channel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "AGPL-3.0-or-later"
publish.workspace = true

[lints]
workspace = true

[dependencies]
hatchling-core = { version = "0.1.0", path = "../hatchling-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Stdin redirection for the stdio-path test of `LocalChannel::receive`.
rustix = { version = "0.38", features = ["pipe", "stdio"] }
