name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **If this is a security problem, don't file it here:** use [private vulnerability reporting](https://github.com/undergroundrap/hatchling/security/advisories/new) instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Exact commands, ideally from a fresh clone. A failing test is even better.
      render: bash
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD`"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Distribution, kernel (`uname -r`), WSL2 or not, `rustc --version`."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant broker or test output. Check it for secrets before pasting.
      render: text
